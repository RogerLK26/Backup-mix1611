# Cấu hình nhỏ để kiểm tra nhanh hệ thống (vài coin, 2 ngày)
name: "smoke"
exchange: binance
start: "2026-10-10 00:00"
end:   "2026-10-12 00:00"
timezone: "Asia/Ho_Chi_Minh"
initial_balance: 1000
data:
  resolution: auto
  intrabar_fallback: conservative
universe:
  symbols: [DOGEUSDT, SOLUSDT, XRPUSDT, WIFUSDT, PEPEUSDT, SUIUSDT]
  min_volume_24h: 5000000
  min_market_cap: null
  market_cap_source: none
signals:
  - timeframe: 1m
    change_pct: 0.6
    direction: both
    trigger: touch
    side: reverse
entry:
  latency_ms: 200
  slippage_pct: 0.02
position:
  margin: 10
  leverage: 10
exit:
  take_profit: 0.5
  stop_loss: 0.5
  max_hold: 30m
limits:
  max_open_positions: 3
  max_open_per_coin: 1
  cooldown_after_sl_coin: 30m
